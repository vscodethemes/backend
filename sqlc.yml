version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "internal/db/schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "public.cube"
            go_type:
              type: "string"
          - db_type: "public.cube"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          # pgx >= 5.9 decodes tsvector in binary format, which can't be scanned
          # into a string. It must be scanned into a pgtype.TSVector.
          - column: "themes.tsv"
            go_type: "github.com/jackc/pgx/v5/pgtype.TSVector"